HI  # ============================================================
# NGINX REVERSE PROXY CONFIGURATION
# ============================================================
# Deploy to: /etc/nginx/sites-available/classgrid
# Then: sudo ln -s /etc/nginx/sites-available/classgrid /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Restart: sudo systemctl restart nginx
#
# This file routes traffic to:
# - classgrid.in → Vercel (marketing Next.js)
# - api.classgrid.in → Gateway (port 4000)
# - app.classgrid.in & *.classgrid.in → Vercel (Vite React app)
# ============================================================

# Define upstream services (for local proxying)
upstream gateway {
    server localhost:4000;
}

upstream auth_service {
    server localhost:4101;
}

upstream tenant_service {
    server localhost:4102;
}

upstream payment_service {
    server localhost:4103;
}

upstream chat_service {
    server localhost:4104;
}

upstream notes_service {
    server localhost:4105;
}

upstream notification_service {
    server localhost:4106;
}

# ============================================================
# REDIRECT HTTP TO HTTPS
# ============================================================
server {
    listen 80;
    server_name classgrid.in www.classgrid.in api.classgrid.in app.classgrid.in *.classgrid.in;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================================
# MARKETING WEBSITE (classgrid.in)
# ============================================================
server {
    listen 443 ssl http2;
    server_name classgrid.in www.classgrid.in;
    
    # SSL Certificates (Let's Encrypt Wildcard)
    ssl_certificate /etc/letsencrypt/live/classgrid.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classgrid.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Logging
    access_log /var/log/nginx/classgrid/marketing-access.log combined;
    error_log /var/log/nginx/classgrid/marketing-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;
    
    # Proxy to Vercel (Next.js marketing site)
    location / {
        proxy_pass https://classgrid-marketing.vercel.app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_ssl_verify off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint
    location /__health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

# ============================================================
# API GATEWAY (api.classgrid.in)
# ============================================================
server {
    listen 443 ssl http2;
    server_name api.classgrid.in;
    
    ssl_certificate /etc/letsencrypt/live/classgrid.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classgrid.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Logging
    access_log /var/log/nginx/classgrid/api-access.log combined;
    error_log /var/log/nginx/classgrid/api-error.log;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Allow larger payloads (file uploads, bulk operations)
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript;
    
    # Proxy to Node.js API Gateway (port 4000)
    location / {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket support (for real-time chat)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts (longer for chat/real-time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://gateway;
        proxy_set_header Host $host;
    }
}

# ============================================================
# WEB APP - WILDCARD TENANT SUBDOMAINS (*.classgrid.in)
# ============================================================
server {
    listen 443 ssl http2;
    # This catches: app.classgrid.in, pccoe.classgrid.in, harvard.classgrid.in, etc.
    server_name app.classgrid.in ~^(?<tenant>[a-z0-9-]+)\.classgrid\.in$;
    
    ssl_certificate /etc/letsencrypt/live/classgrid.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classgrid.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Logging (with tenant name)
    access_log /var/log/nginx/classgrid/tenant-access.log combined;
    error_log /var/log/nginx/classgrid/tenant-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Tenant-Slug $tenant always;
    
    # Allow file uploads
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript;
    
    # Proxy to Vercel (Vite React web app)
    location / {
        proxy_pass https://classgrid-web-app.vercel.app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Tenant-Slug $tenant;
        proxy_ssl_verify off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass https://classgrid-web-app.vercel.app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Health check
    location /__health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

# ============================================================
# DEFAULT SERVER (Catch-all for undefined hosts)
# ============================================================
server {
    listen 443 ssl http2 default_server;
    server_name _;
    
    ssl_certificate /etc/letsencrypt/live/classgrid.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classgrid.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    location / {
        return 444; # Close connection without sending response
    }
}
