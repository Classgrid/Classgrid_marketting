name: Deploying RAG to Server

on:
  push:
    branches:
      - main
    paths:
      - 'server-ai/**'
      - 'lib/**'
      - 'tsconfig.json'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_KEY }}

      - name: Add AWS Server to known_hosts
        run: |
          ssh-keyscan -H 16.192.13.132 >> ~/.ssh/known_hosts

      - name: Generate .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.AI_PRODUCTION_ENV }}
          EOF

      - name: Deploy Code via SSH and restart PM2
        run: |
          ssh ubuntu@16.192.13.132 << 'EOF'
            sudo mkdir -p /var/www/classgrid_ai
            sudo chown -R ubuntu:ubuntu /var/www/classgrid_ai
          EOF
          
          # Copy ALL required files to the AWS server
          scp -r server-ai lib ubuntu@16.192.13.132:/var/www/classgrid_ai/
          scp server-ai/tsconfig.server.json ubuntu@16.192.13.132:/var/www/classgrid_ai/tsconfig.json
          scp .env ubuntu@16.192.13.132:/var/www/classgrid_ai/.env
          
          # Install dependencies and restart PM2
          ssh ubuntu@16.192.13.132 << 'EOF'
            cd /var/www/classgrid_ai
            ln -sf server-ai/node_modules node_modules
            
            cd /var/www/classgrid_ai/server-ai
            npm install --legacy-peer-deps
            
            # Use PM2 to run the typescript file using tsx
            pm2 restart classgrid-ai 2>/dev/null || pm2 start npm --name "classgrid-ai" --cwd /var/www/classgrid_ai/server-ai -- run start
            pm2 save
          EOF

